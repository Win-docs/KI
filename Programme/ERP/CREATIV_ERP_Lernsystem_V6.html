function invPosting(id,qty,ref,kind,date,unitCost=null){const i=item(id);if(!i)throw Error('Artikel nicht gefunden: '+id);const before=i.qty;const next=round(before+qty);if(next<0)throw Error(`Bestand für ${i.name} reicht nicht aus (${fmt(before)} verfügbar).`);i.qty=next;db.inventoryLedger.push({id:newid('LP'),itemId:id,qty:round(qty),before,after:next,unitCost:unitCost??i.buy,ref,kind,date});return i}

function saleShip(o){if(o.status!=='Offen'&&o.status!=='Freigegeben')throw Error('Auftrag ist nicht lieferbar.');const need={};for(const l of o.lines)need[l.itemId]=(need[l.itemId]||0)+l.qty;for(const [id,qty] of Object.entries(need)){if(item(id).qty<qty)throw Error(`Nicht genügend Bestand: ${item(id).name}`)}const ref=newid('LIEF');for(const l of o.lines){const i=invPosting(l.itemId,-l.qty,ref,'Verkauf / Lieferung',o.deliveryDate);const cost=round(l.qty*i.buy);postGL(i.group==='FERTIG'?'5202':'6000',cost,0,ref,'Warenwert / Bestandabgang '+i.name,o.deliveryDate,o.customerId);postGL(invAccount(i),0,cost,ref,'Lagerabgang '+i.name,o.deliveryDate,o.customerId)}db.shipments.push({id:ref,orderId:o.id,customerId:o.customerId,date:o.deliveryDate,lines:structuredClone(o.lines)});o.status='Geliefert';o.shipmentId=ref;addLog('Lieferung',ref,`${o.id}: ${o.lines.length} Position(en) ausgeliefert`);save();notify('Lieferung '+ref+' gebucht. Lager und Wareneinsatz aktualisiert.')}
function saleInvoice(o){if(o.status!=='Geliefert')throw Error('Bitte den Auftrag zuerst liefern.');const net=orderTotal(o),vat=tax(net),gross=round(net+vat),ref=newid('RE');db.invoices.push({id:ref,orderId:o.id,customerId:o.customerId,date:o.deliveryDate,net,vat,gross,paid:false,shipmentId:o.shipmentId});postGL('2400',gross,0,ref,'Ausgangsrechnung '+o.id,o.deliveryDate,o.customerId);postGL('5000',0,net,ref,'Umsatzerlöse '+o.id,o.deliveryDate,o.customerId);postGL('4800',0,vat,ref,'Umsatzsteuer 19 %',o.deliveryDate,o.customerId);db.ar.push({id:newid('DP'),ref,customerId:o.customerId,date:o.deliveryDate,amount:gross,open:gross,type:'Rechnung'});o.status='Fakturiert';o.invoiceId=ref;addLog('Rechnung',ref,`${o.id}: ${money(gross)} brutto`);save();notify('Rechnung '+ref+' gebucht. Debitorenposten und Sachposten angelegt.')}
function receivePurchase(p){if(p.status!=='Offen')throw Error('Bestellung bereits bearbeitet.');const ref=newid('WE');for(const l of p.lines){const i=invPosting(l.itemId,l.qty,ref,'Einkauf / Wareneingang',p.date,l.price);const value=round(l.qty*l.price);postGL(invAccount(i),value,0,ref,'Wareneingang '+i.name,p.date,p.vendorId);postGL('3405',0,value,ref,'WE/RE-Verrechnung '+i.name,p.date,p.vendorId)}p.status='Eingegangen';p.receiptId=ref;db.receipts.push({id:ref,orderId:p.id,vendorId:p.vendorId,date:p.date,lines:structuredClone(p.lines)});addLog('Wareneingang',ref,`${p.id} eingegangen`);save();notify('Wareneingang '+ref+' gebucht. Bestände aktualisiert.')}

function newOrder(type='sale'){const sale=type==='sale',people=sale?db.customers:db.vendors;let body=`<div class="formgrid">${selectField(sale?'Debitor':'Kreditor','partner',people.map(x=>[x.id,x.id+' · '+x.name]),sale?'24005':'44005')}${field('Belegdatum','date',sale&&mode==='guided'?'2026-10-02':today(),'date','required')}${sale?field('Gewünschtes Lieferdatum','deliveryDate',mode==='guided'?'2026-10-08':today(),'date','required'):''}</div><div class="formlines"><table><thead><tr><th>Artikel</th><th style="width:120px">Menge</th><th style="width:130px">Einzelpreis netto (€)</th><th style="width:110px">Aktion</th></tr></thead><tbody id="lineRows">${orderLineHTML(type)}</tbody></table></div><p>${btn('＋ Position hinzufügen','addLine')}</p><p class="hint">${sale?'Beim Anlegen wird der Artikel reserviert, aber noch nicht ausgebucht.':'Beim Anlegen wird noch kein Wareneingang gebucht.'} Netto-Einzelpreise sind änderbar.</p>`;openModal(sale?'Neuer Verkaufsauftrag':'Neue Einkaufsbestellung',body,f=>{const lines=[...document.querySelectorAll('#lineRows tr')].map(tr=>({itemId:tr.querySelector('.line-item').value,qty:num(tr.querySelector('.line-qty').value),price:num(tr.querySelector('.line-price').value)}));if(!lines.length)throw Error('Mindestens eine Position erforderlich.');if(lines.some(l=>!item(l.itemId)||!(l.qty>0)||l.price<0||!Number.isFinite(l.price)))throw Error('Bitte gültige Artikel, Mengen und Preise angeben.');const date=String(f.get('date')),deliveryDate=sale?String(f.get('deliveryDate')):date;if(!date||!deliveryDate)throw Error('Bitte gültige Daten angeben.');if(sale){let totals={};for(const l of lines)totals[l.itemId]=(totals[l.itemId]||0)+l.qty;for(const [id,q] of Object.entries(totals))if(q>available(id))throw Error(`Nicht genügend verfügbarer Bestand für ${item(id).name}: ${fmt(available(id))}.`)}const o={id:newid(sale?'VA':'EB'),[sale?'customerId':'vendorId']:String(f.get('partner')),date,deliveryDate,lines,status:'Offen',exercise:sale&&mode==='guided'&&String(f.get('partner'))==='24005'&&date==='2026-10-02'&&deliveryDate==='2026-10-08'&&lines.some(l=>l.itemId==='210001'&&l.qty===2)};if(sale)db.sales.push(o);else db.purchases.push(o);addLog(sale?'Verkaufsauftrag':'Einkaufsbestellung',o.id,`${sale?customer(o.customerId).name:vendor(o.vendorId).name} · ${money(orderTotal(o))} netto`);save();navigate(sale?'sales':'purchases');notify((sale?'Auftrag ':'Bestellung ')+o.id+' angelegt.')},'Beleg anlegen');const first=$('.line-item');if(first){if(sale)first.value='210001';else first.value='203001';const price=first.selectedOptions[0]?.dataset.price||'0';$('.line-price').value=price;} }

function exportCSV(which){let data=[],keys=[];switch(which){case 'items':data=db.items;keys=['id','name','qty','unit','buy','sell','group','vendor','reorder','safety','method'];break;case 'inventory':data=db.items.map(i=>({...i,reserved:stockReserved(i.id),available:available(i.id)}));keys=['id','name','qty','reorder','safety','reserved','available','method'];break;case 'itemledger':data=db.inventoryLedger;keys=['id','itemId','qty','before','after','unitCost','ref','kind','date'];break;case 'gl':data=db.gl;keys=['id','date','account','debit','credit','ref','text','party'];break;case 'flow':data=db.log;keys=['id','type','ref','description','at'];break;default:throw Error('Unbekannte CSV-Auswahl')}const csv='\ufeff'+keys.join(';')+'\r\n'+data.map(row=>keys.map(k=>csvEscape(row[k])).join(';')).join('\r\n');download('CREATIV_'+which+'_'+today()+'.csv',csv,'text/csv;charset=utf-8');notify('CSV-Datei exportiert.')}
function importJSON(){openModal('Übungsstand importieren',`<label class="field">JSON-Datei auswählen<input id="jsonFile" type="file" accept=".json,application/json" required></label><p class="hint warn">Der gerade ausgewählte Übungsstand wird vollständig ersetzt. Sichere ihn vorher bei Bedarf als JSON.</p>`,()=>{const file=$('#jsonFile').files[0];if(!file)throw Error('Bitte eine Datei wählen.');const reader=new FileReader();reader.onload=()=>{try{const d=JSON.parse(reader.result);if(d.version!==5||!Array.isArray(d.items)||!Array.isArray(d.sales)||!Array.isArray(d.gl)||!Array.isArray(d.inventoryLedger))throw Error('Ungültige oder nicht kompatible Übungsdatei.');db=d;save();navigate('dashboard');notify('Übungsstand importiert.')}catch(err){notify(err.message,'error')}};reader.readAsText(file)},'Import starten')}
function reset(){openModal('Übungsmandant zurücksetzen',`<p>Alle Aufträge, Buchungen, Zahlungen und Fertigungsaufträge werden gelöscht. Die Ausgangsdaten und Bestände werden wiederhergestellt.</p><label class="field">Zur Bestätigung RESET eingeben<input name="confirm" required autocomplete="off" placeholder="RESET"></label>`,f=>{if(String(f.get('confirm')).trim()!=='RESET')throw Error('Bitte RESET eingeben.');db=fresh();save();navigate(mode==='guided'?'exercise':'dashboard');notify('Ausgewählter Übungsstand zurückgesetzt.')},'Endgültig zurücksetzen')}
function handleAction(action,id){try{switch(action){case 'mode':switchMode(id);break;case 'nav':navigate(id);break;case 'module':module=id;view=NAV.find(m=>m.id===id)?.views[0][0]||'dashboard';search='';render();break;case 'newSale':newOrder('sale');break;case 'newPurchase':newOrder('purchase');break;case 'newProduction':newProduction();break;case 'seedExercise':seedExercise();break;case 'saleDetail':case 'purchaseDetail':case 'productionDetail':case 'trace':case 'itemDetail':case 'customerDetail':case 'vendorDetail':showDetail(action,id);break;case 'shipSale':{const o=byId(db.sales,id);confirmAction('Lieferung buchen',`Auftrag ${id} jetzt liefern und den Bestand ausbuchen?`,()=>{saleShip(o);showDetail('saleDetail',id)});break}case 'invoiceSale':{const o=byId(db.sales,id);confirmAction('Verkaufsrechnung buchen',`Rechnung über ${money(round(orderTotal(o)+tax(orderTotal(o))))} für Auftrag ${id} buchen?`,()=>{saleInvoice(o);showDetail('saleDetail',id)});break}case 'receivePurchase':{const p=byId(db.purchases,id);confirmAction('Wareneingang buchen',`Bestellung ${id} einlagern?`,()=>{receivePurchase(p);showDetail('purchaseDetail',id)});break}case 'invoicePurchase':{const p=byId(db.purchases,id);confirmAction('Eingangsrechnung buchen',`Eingangsrechnung zu ${id} buchen?`,()=>{invoicePurchase(p);showDetail('purchaseDetail',id)});break}case 'paySale':{const inv=byId(db.invoices,id);confirmAction('Kundenzahlung buchen',`Zahlungseingang über ${money(inv.gross)} zu ${id} buchen?`,()=>{payInvoice(inv,'AR');navigate('invoices')});break}case 'payPurchase':{const inv=byId(db.vendorInvoices,id);confirmAction('Lieferantenzahlung buchen',`Zahlungsausgang über ${money(inv.gross)} zu ${id} buchen?`,()=>{payInvoice(inv,'AP');navigate('vendorinvoices')});break}case 'finishProduction':{const p=byId(db.production,id);confirmAction('Fertigmeldung buchen',`${fmt(p.qty)} Stück ${item(p.itemId).name} fertigmelden? Der Materialbedarf wird aus der Stückliste berechnet.`,()=>{finishProduction(p);showDetail('productionDetail',id)});break}case 'closeModal':closeModal();break;case 'addLine':{const tbody=$('#lineRows');if(!tbody)return;const tr=document.createElement('tbody');tr.innerHTML=orderLineHTML($('#modalTitle').textContent.includes('Verkaufs')?'sale':'purchase');const row=tr.firstElementChild;tbody.appendChild(row);const sel=row.querySelector('.line-item');row.querySelector('.line-price').value=sel.selectedOptions[0]?.dataset.price||0;break}case 'removeLine':{const rows=$('#lineRows');if(rows?.children.length>1)rows.lastElementChild.remove();else notify('Mindestens eine Position ist erforderlich.','error');break}case 'export':exportJSON();break;case 'csv':exportCSV(id);break;case 'import':importJSON();break;case 'reset':reset();break;default:console.warn('Unbekannte Aktion',action)}}catch(err){notify(err.message||String(err),'error')}}
document.addEventListener('click',ev=>{const target=ev.target.closest('[data-action]');if(target){ev.preventDefault();handleAction(target.dataset.action,target.dataset.id||'')}});
document.addEventListener('change',ev=>{if(ev.target.classList.contains('line-item')){const row=ev.target.closest('tr');row.querySelector('.line-price').value=ev.target.selectedOptions[0]?.dataset.price||0}});
document.addEventListener('input',ev=>{if(ev.target.id==='search'){const next=ev.target.value,sel=ev.target.selectionStart;search=next;render();const inp=$('#search');inp?.focus();inp?.setSelectionRange(sel,sel)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&modal)closeModal()});
$('#modeGuide').addEventListener('click',()=>switchMode('guided'));$('#modeFree').addEventListener('click',()=>switchMode('free'));$('#homeTop').addEventListener('click',()=>navigate(mode==='guided'?'exercise':'dashboard'));$('#helpTop').addEventListener('click',()=>navigate(mode==='guided'?'exercise':'settings'));$('#printTop').addEventListener('click',()=>window.print());$('#exportTop').addEventListener('click',exportJSON);$('#newTop').addEventListener('click',()=>view==='purchases'||module==='Einkauf'?newOrder('purchase'):module==='Produktion'?newProduction():newOrder('sale'));
render();window.CREATIV_ERP_TEST={getMode:()=>mode,switchMode,getState:()=>structuredClone(db),reset:()=>{db=fresh();save();navigate(mode==='guided'?'exercise':'dashboard')},newExercise:seedExercise,ship:id=>saleShip(byId(db.sales,id)),invoice:id=>saleInvoice(byId(db.sales,id)),pay:id=>payInvoice(byId(db.invoices,id),'AR'),getStock:id=>item(id)?.qty};
})();
</script>
</body>
