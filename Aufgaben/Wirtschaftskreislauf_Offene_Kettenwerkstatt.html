function iter(n,fn,parent=null,path=[]){if(!n)return;fn(n,parent,path);n.children.forEach(c=>iter(c,fn,n,[...path,n]));}
function lookup(n,id){if(!n)return null;if(n.id===id)return n;for(const c of n.children){let v=lookup(c,id);if(v)return v;}return null;}

function addNode(key,parentId){if(!DATA[key]||(parentId==='root'&&root))return;let p=parentId==='root'?null:lookup(root,Number(parentId));if(parentId!=='root'&&!p)return;mutate(()=>{let n={id:++nextId,key,dir:null,children:[]};if(p)p.children.push(n);else root=n;selected=null;});}
function changeDir(id,dir){let n=lookup(root,id);if(n&&n.dir!==dir)mutate(()=>n.dir=dir);}
function erase(id){mutate(()=>{if(root?.id===id){root=null;return;}iter(root,n=>n.children=n.children.filter(c=>c.id!==id));});}
function rewind(){if(!undoStack.length)return;root=JSON.parse(undoStack.pop());review=null;selected=null;render();}

function validEdge(a,b){if(!EDGES[a]?.includes(b))return false;return !(cas().blocked||[]).includes(a+'|'+b);}
function viableEffectPath(path){if(path.length<5||path[0].key!==cas().start)return false;
 const nodes=path.map(x=>x.key),fe=nodes.indexOf('Fe'),eff=nodes.lastIndexOf('effect');
 if(fe<0||eff<0)return false;
 const firstCompany=nodes.slice(1,fe).some(k=>k==='Uums'||k==='Uprod');
 const consumer=nodes.findIndex((k,i)=>i>fe&&k==='CH');
 const secondCompany=nodes.findIndex((k,i)=>i>consumer&&k==='Uums');
 return firstCompany&&consumer>fe&&secondCompany>consumer&&eff>secondCompany;
}
function countReview(){let items=[],states={},mainPaths=[];
 iter(root,(nd,parent,path)=>{
  let message='',status='good',data=DATA[nd.key];
  if(!parent){if(nd.key!==cas().start){status='bad';message=`Der Fall beginnt mit ${DATA[cas().start].name}, nicht mit ${data.name}.`;}}
  else if(!validEdge(parent.key,nd.key)){status='bad';message=`Die direkte Verbindung ${DATA[parent.key].name} → ${data.name} ist in diesem Fall nicht hinreichend begründet. Ergänze einen passenden Zwischenschritt oder wähle eine andere Verbindung.`;}
  if(nd.dir===null){if(status!=='bad')status='open';message=message||'Wähle noch „steigt“ oder „sinkt“.';}
  else if(dirFor(nd.key)===null){status='bad';message=`Dieser Baustein lässt sich aus der beschriebenen Situation nicht eindeutig ableiten.`;}
  else if(nd.dir!==dirFor(nd.key)){status='bad';message=`Prüfe die Richtung von ${data.name}: Deine Auswahl passt nicht zu den Fallannahmen.`;}
  const parentOk=!parent||states[parent.id]?.status==='good';
  if(status==='good'&&!parentOk){status='warn';message='Die direkte Richtung passt, aber der vorherige Schritt muss zuerst geklärt werden.';}
  if(status==='good'&&nd.key==='effect'&&!viableEffectPath([...path,nd])){status='warn';message='Für den Multiplikatoreffekt fehlt auf diesem Weg noch der Kreislauf über Unternehmen → Faktoreinkommen → Konsum → neue Unternehmensumsätze.';}
  if(status==='good'&&parent)message=EDGE_NOTE[parent.key+'|'+nd.key]||'Verbindung und Entwicklungsrichtung sind unter den Fallannahmen plausibel.';
  if(status==='good'&&nd.key==='effect')mainPaths.push([...path,nd]);
  states[nd.id]={status,message};items.push({...nd,status,message});
 });
 let budgetWarnings=[];
 iter(root,n=>{if(n.children.some(x=>x.key==='SSt'&&states[x.id]?.status==='good')&&n.children.some(x=>x.key==='KrSt'&&states[x.id]?.status==='good'))budgetWarnings.push('Staatliches Sparen und die Veränderung der staatlichen Kredite beschreiben in diesem Beispiel mögliche Alternativen. Beide folgen nicht automatisch gleichzeitig. Begründe deine Haushaltsannahme oder wähle einen Weg.');});
 const markers={start:false,U:false,Fe:false,CH:false,effect:mainPaths.length>0};
 iter(root,nd=>{if(states[nd.id]?.status!=='good')return;if(nd.key===cas().start)markers.start=true;if(nd.key==='Uums'||nd.key==='Uprod')markers.U=true;if(nd.key==='Fe')markers.Fe=true;if(nd.key==='CH')markers.CH=true;});
 const mistakes=items.filter(x=>x.status==='bad'),pending=items.filter(x=>x.status==='open'),warn=items.filter(x=>x.status==='warn');
 const branches={tax:items.some(x=>['Tind','Tdir'].includes(x.key)&&x.status==='good'),saving:items.some(x=>x.key==='SH'&&x.status==='good'),state:items.some(x=>x.key==='St'&&x.status==='good')};
 const done=mainPaths.length>0&&!mistakes.length&&!pending.length&&!warn.length&&!budgetWarnings.length;
 return {states,items,correct:items.filter(x=>x.status==='good').length,mistakes,pending,warn,budgetWarnings,markers,branches,done};
}

 ${hintVisible?`<div class="tip-box" style="margin-top:12px"><b>Denkanstoß:</b> ${getHint()}</div>`:''}${reviewMarkup()}${solutionVisible?`<section class="solution"><h3>Beispielwege – nicht die einzigen richtigen Lösungen</h3><div class="solution-row">${solutionRow(examplePath(false))}</div><div class="solution-row">${solutionRow(examplePath(true))}</div><div class="solution-row"><b>Mögliche weitere Zweige:</b> ${c.branch}</div><p class="solution-note">Die beiden Hauptketten sind alternative Möglichkeiten. Zusätzliche Steuer-, Spar- und Finanzierungseffekte können je nach Fall und Annahmen auftreten.</p></section>`:''}
 <p class="footnote"><b>Fallannahme:</b> ${c.note} Der Multiplikatoreffekt wird als wirtschaftliche Rückkopplung verstanden, nicht als garantierte Veränderung aller Geldströme.</p></main>
 <aside class="card palette"><h3>Bausteine</h3><p>Ziehe Karten in das Arbeitsfeld – oder tippe zuerst einen Baustein an und danach auf <b>+</b>. Karten können mehrfach verwendet werden.</p>${GROUPS.map(([name,ids])=>`<section class="group"><h4>${name}</h4><div class="tiles">${ids.map(k=>`<button class="tile ${DATA[k].kind==='outcome'?'outcome':''} ${selected===k?'active':''}" type="button" draggable="true" data-action="pick" data-key="${k}" aria-pressed="${selected===k}"><b>${DATA[k].s}</b><small>${html(DATA[k].name)}</small></button>`).join('')}</div></section>`).join('')}<div class="palette-tip">${selected?`Ausgewählt: <b>${DATA[selected].s} · ${html(DATA[selected].name)}</b>. Tippe nun auf <b>+</b>.`:'Wähle einen Ausgangsbaustein. Nicht alle angebotenen Karten sind im jeweiligen Fall richtig.'}<br><br><b>Neu:</b> Fe → T<sup>dir</sup> ist als direkte Verbindung zulässig, wenn sich steuerpflichtiges Faktoreinkommen verändert.</div></aside></div>`;}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||!app.contains(b))return;
 if(b.hasAttribute('data-parent')){if(selected)addNode(selected,b.dataset.parent);else{b.classList.add('over');setTimeout(()=>b.classList.remove('over'),280);}return;}
 switch(b.dataset.action){case 'switch':switchCase(Number(b.dataset.index));break;case 'pick':selected=selected===b.dataset.key?null:b.dataset.key;render();break;case 'dir':changeDir(Number(b.dataset.id),Number(b.dataset.dir));break;case 'remove':erase(Number(b.dataset.id));break;case 'undo':rewind();break;case 'clear':mutate(()=>root=null);selected=null;break;case 'check':review=countReview();render();document.getElementById('review')?.scrollIntoView({block:'nearest',behavior:'smooth'});break;case 'model':modelVisible=!modelVisible;render();break;case 'help':tipsVisible=!tipsVisible;render();break;case 'hint':hintVisible=!hintVisible;render();break;case 'example':solutionVisible=!solutionVisible;render();break;}
});
app.addEventListener('dragstart',e=>{const el=e.target.closest('[draggable="true"][data-key]');if(!el)return;selected=el.dataset.key;e.dataTransfer.effectAllowed='copy';e.dataTransfer.setData('text/plain',selected)});
app.addEventListener('dragover',e=>{const t=e.target.closest('[data-parent]');if(!t)return;e.preventDefault();e.dataTransfer.dropEffect='copy';t.classList.add('over')});
app.addEventListener('dragleave',e=>{const t=e.target.closest('[data-parent]');if(t)t.classList.remove('over')});
app.addEventListener('drop',e=>{const t=e.target.closest('[data-parent]');if(!t)return;e.preventDefault();t.classList.remove('over');const key=e.dataTransfer.getData('text/plain')||selected;if(DATA[key])addNode(key,t.dataset.parent)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&selected){selected=null;render()}});
render();
})();
</script></body></html>
