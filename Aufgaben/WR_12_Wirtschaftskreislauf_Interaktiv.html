<style>

.main{display:grid;gap:17px;min-width:0}.scenario{padding:21px 24px;border-left:5px solid #0889ba}.scenario .topline{display:flex;justify-content:space-between;flex-wrap:wrap;align-items:center;gap:7px}.kicker{font-size:11px;color:#317794;letter-spacing:.09em;font-weight:800;text-transform:uppercase}.scenario h2{margin:8px 0 6px;color:#122f47;font-size:clamp(18px,2.5vw,24px);letter-spacing:-.018em}.scenario p{font-size:15px;margin:0;line-height:1.6;color:#4a6171}.direction{font-size:12px;font-weight:750;padding:6px 10px;border:1px solid #deebf3;border-radius:8px;background:#f3f9fc;color:#3d6c85}
.diagram{padding:18px 18px 14px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.section-head h3{margin:0;font-size:16px;letter-spacing:-.01em;color:#18364e}.quiet-btn{color:#16759c;border:1px solid #d9e6ee;padding:8px 10px;border-radius:9px;background:white;font-weight:700;font-size:12px}.quiet-btn:hover{background:#eaf5fc}.stream-status{color:#536d7e;background:#f1f6f9;border:1px solid #e0eaf0;border-radius:9px;padding:8px 10px;font-weight:750;font-size:12px}.diagram-svg{display:block;width:100%;height:auto;margin:9px auto 0;max-height:460px}.flow-path{fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}.math-symbol{white-space:nowrap}.math-symbol sup,.math-symbol sub{font-size:.7em;line-height:0;position:relative;vertical-align:baseline}.math-symbol sup{top:-.52em}.math-symbol sub{bottom:-.24em}.flow-label{font-family:inherit;font-weight:750;font-size:17px;text-anchor:middle;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}.node{rx:12;ry:12;stroke-width:2.5}.node-label{font-family:inherit;font-weight:850;font-size:23px;fill:white;text-anchor:middle}.node-sub{font-family:inherit;font-size:13px;fill:white;text-anchor:middle;opacity:.92}.active-symbol{font-family:inherit;font-size:16px;font-weight:900;text-anchor:middle}.diagram-note{border-top:1px solid #eef2f7;margin:3px 2px 0;padding:11px 1px 0;color:#63788a;font-size:12px;line-height:1.55}.swatch{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 5px 0 8px}.swatch:first-child{margin-left:0}.legend-strong{font-weight:800;color:#294658}
.chain{padding:17px 21px}.chain-label{font-size:12px;font-weight:800;color:#47677d;margin-bottom:11px}.chain-steps{display:flex;gap:7px;align-items:center;flex-wrap:wrap;min-height:39px}.chain-empty{font-size:13px;color:#8796a4;font-style:italic}.chip{padding:8px 11px;border-radius:8px;font-weight:750;font-size:12px;line-height:1.2}.chip.up{background:#e3f7ee;color:#076e49}.chip.down{background:#fff0ec;color:#aa4937}.chain-arrow{font-size:17px;color:#9fb3c4}
.exercise{padding:23px 24px}.exercise-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.progress{display:flex;gap:5px}.dot{width:22px;height:6px;background:#e0e9ef;border-radius:9px}.dot.achieved{background:#278bb5}.dot.current{background:#89bcd6}.question{margin:16px 0 14px;color:#18354c;font-size:clamp(17px,2.2vw,22px);line-height:1.4;letter-spacing:-.01em;font-weight:750}.answers{display:grid;gap:9px}.answer{padding:12px 15px;display:flex;text-align:left;align-items:center;gap:12px;background:#fff;border:1px solid #dfe6ee;border-radius:11px;color:#263c4e;line-height:1.5;transition:.12s}.answer:hover{border-color:#8dbdd8;background:#f6fbff}.answer.selected{border-color:#0486bd;background:#eef8ff}.answer.right{border-color:#43ab82;background:#e7f8f0}.answer.wrong{border-color:#dc8f82;background:#fff0ed}.answer-key{flex:0 0 auto;width:24px;height:24px;display:grid;place-items:center;background:#eff3f7;border-radius:8px;color:#658096;font-size:12px;font-weight:900}.answer.selected .answer-key{background:#0579b3;color:white}.feedback{padding:12px 15px;margin-top:13px;border-radius:10px;line-height:1.5;font-size:13px}.feedback.good{background:#e7f7ef;color:#146447}.feedback.bad{background:#fff0ed;color:#9f493a}.feedback strong{display:block;margin-bottom:3px}.actions{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-top:16px}.primary{border:0;border-radius:10px;background:#087db6;color:white;font-weight:800;font-size:13px;padding:11px 17px}.primary:hover{background:#046697}.primary:disabled{opacity:.5;cursor:not-allowed}.secondary{border:1px solid #dce7ee;border-radius:10px;background:white;color:#4d6b7f;font-weight:750;font-size:13px;padding:10px 13px}.secondary:hover{background:#f0f6fa}.subheading{font-size:13px;color:#527087;margin:3px 0 12px;line-height:1.6}.conclusion{background:#f0fbf6;border:1px solid #bde5d0;border-radius:14px;padding:17px;margin-top:16px}.conclusion.down{background:#fff5f2;border-color:#eed0c7}.conclusion h3{margin:0 0 7px;font-size:18px}.conclusion p{margin:0;color:#465e6c;line-height:1.6;font-size:14px}.solution{background:#f6f9fc;border:1px solid #e0eaf2;border-radius:13px;padding:16px;margin-top:15px}.solution h3{margin:0 0 8px;font-size:14px;color:#163a56}.solution p{margin:0 0 9px;font-size:13px;line-height:1.6;color:#516a7d}.solution strong{color:#203b53}.solution-tag{font-weight:850}.footnote{font-size:12px;line-height:1.6;color:#708597;margin-top:13px}.hide-mobile{display:inline}.noscript{padding:20px;color:#8e402c}

/* Vertiefung: als eigenständige zweite Aufgabenreihe abgesetzt */
.series-divider{margin:13px 1px 6px;padding:13px 12px 8px;border-top:2px solid #dfcff8;color:#6635a7}
.series-divider .series-head{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:900;letter-spacing:.025em}
.series-divider p{margin:6px 0 0;font-size:11px;line-height:1.5;color:#81689f}
.case-button.advanced{background:#f6f0ff;border-color:#eadbff}
.case-button.advanced:hover{background:#f0e7ff}
.case-button.advanced.active{background:#eee1ff;border-color:#aa80ec;box-shadow:inset 4px 0 #8453d2}
.case-button.advanced .case-type{color:#8061a8}

.chain.advanced{border-color:#e2d3f4}
.chain.advanced .chain-label{color:#7344a9}
.exercise.advanced{border-color:#e4d8f5}

.exercise.advanced .primary{background:#8050c6}.exercise.advanced .primary:hover{background:#6b3ab2}

.chip.mixed{background:#efe4ff;color:#6e359e}

.branch-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:9px}

.branch-lane:nth-child(3){background:#f8fbf9;border-color:#d5e9df}
.branch-title{font-size:12px;color:#7046a3;font-weight:900;margin-bottom:10px}

.branch-chips{display:grid;gap:7px}

.branch-step.up{border-left:3px solid #15a175}
.branch-step.down{border-left:3px solid #e47e63}
.branch-step.mixed{border-left:3px solid #9761ca}

.branch-loop:before{content:'↻';font-size:23px;color:#8859c6}
.branch-explanation{margin-top:12px;font-size:12px;color:#685a7b;line-height:1.5}
.branch-summary{display:grid;gap:8px;margin:10px 0 13px}

@media(max-width:610px){.branch-grid{grid-template-columns:1fr}.branch-fork{display:none}.branch-root{justify-content:flex-start;margin-bottom:9px}.branch-lane{min-height:0}.series-divider{padding:13px 9px 7px}}

<script>
(()=>{
'use strict';
const UP='↑',DOWN='↓';
const steps=(...args)=>args.map(([question,options,correct,why,focus,chip,hint,branch,effects])=>({question,options,correct,why,focus,chip,hint,branch,effects:effects?.map(([id,dir,optional])=>({id,dir,optional:!!optional}))}));
const scenarios=[
{id:'export',name:'Exportboom',type:'Außenhandel',title:'Ausländische Nachfrage steigt',trigger:'Die Nachfrage aus dem Ausland nach deutschen Produkten steigt stark an.',dir:1,outcome:'positiv',kind:'expansiv',chain:'X ↑ → Umsätze der Unternehmen ↑ → Produktion und Beschäftigung ↑ → Faktoreinkommen Fe ↑ → verfügbares Einkommen der Haushalte ↑ → Konsum C_H ↑ → zusätzliche Umsätze.',finish:'Der zusätzliche Exporterlös löst weitere Ausgaben- und Einkommensrunden aus. Die gesamte Nachfrage wird dadurch über den ersten Exportimpuls hinaus angeregt.',steps:steps(
 ['Welcher Geldstrom ist unmittelbar betroffen?',['Die Exporte X nehmen zu.','Die Importe M nehmen zu.','Der Haushaltskonsum C_H sinkt.'],0,'Zahlungen aus dem Ausland für deutsche Produkte erhöhen den Exportstrom X.','X','Exporte X ↑','Denke an den Geldstrom vom Ausland zu den Unternehmen.'],
 ['Welche unmittelbare Wirkung hat das auf Unternehmen?',['Die Steuerzahlungen der Haushalte steigen automatisch.','Aufträge und Umsätze steigen.','Die Umsätze der Unternehmen sinken.'],1,'Zusätzliche Exportnachfrage bringt Unternehmen weitere Aufträge und Umsätze.','U','Unternehmensumsatz ↑','Wer erhält die Zahlungen für die exportierten Produkte?'],
 ['Wie können die Unternehmen auf die zusätzlichen Aufträge reagieren?',['Sie müssen ihre Produktion senken.','Sie sparen grundsätzlich alle Einnahmen.','Sie weiten Produktion und Beschäftigung aus.'],2,'Bei ausreichenden Kapazitäten führt die zusätzliche Nachfrage zu mehr Produktion und Beschäftigung.','U','Produktion und Beschäftigung ↑','Um zusätzliche Bestellungen zu bedienen, muss mehr hergestellt werden.'],
 ['Welcher Geldstrom steigt dadurch typischerweise?',['Das Faktoreinkommen Fe, etwa Löhne und Gewinne.','Der Importstrom M muss sinken.','Die staatlichen Transferzahlungen Z_H sinken zwangsläufig.'],0,'Mehr Arbeit und Produktion erhöhen typischerweise Löhne und andere Faktoreinkommen, also Fe.','Fe','Faktoreinkommen Fe ↑','Zwischen Unternehmen und Haushalten fließen Löhne, Gehälter und andere Einkommen.'],
 ['Was verändert sich bei den Haushalten?',['Sie müssen ihren Konsum vollständig einstellen.','Ihr verfügbares Einkommen wächst.','Ihr verfügbares Einkommen sinkt trotz höherer Faktoreinkommen zwangsläufig.'],1,'Bei sonst unveränderten Bedingungen verfügen Haushalte über mehr Einkommen.','H','verfügbares Einkommen ↑','Mehr Lohn- und Gewinneinkommen kann die Kaufkraft erhöhen.'],
 ['Wie setzt sich der Nachfrageimpuls fort?',['Staatlicher Konsum C_St fällt automatisch.','Haushalte geben das ganze zusätzliche Einkommen ausschließlich im Ausland aus.','Ein Teil wird für zusätzlichen Konsum C_H ausgegeben; die Unternehmensumsätze steigen erneut.'],2,'Zusätzlicher Haushaltskonsum erzeugt weitere Umsätze: Es beginnt die nächste Einkommensrunde.','CH','Konsum C_H ↑','Welche Ausgaben der Haushalte fließen wieder zu den Unternehmen?'])},
{id:'state-cut',name:'Staat spart beim Einkauf',type:'Fiskalpolitik',title:'Staatliche Nachfrage geht zurück',trigger:'Der Staat bestellt deutlich weniger Waren und Dienstleistungen bei inländischen Unternehmen.',dir:-1,outcome:'negativ',kind:'kontraktiv',chain:'Staatskonsum C_St ↓ → Umsätze der Unternehmen ↓ → Produktion und Beschäftigung ↓ → Faktoreinkommen Fe ↓ → verfügbares Einkommen der Haushalte ↓ → Konsum C_H ↓ → weitere Umsatzrückgänge.',finish:'Der Rückgang staatlicher Käufe senkt zunächst die Nachfrage der Unternehmen. Weil anschließend Einkommen und privater Konsum nachlassen, verstärkt sich die ursprüngliche Nachfrageschwäche.',steps:steps(
 ['Welcher Geldstrom geht unmittelbar zurück?',['Transferzahlungen Z_H steigen.','Staatskonsum C_St sinkt.','Exporte X steigen.'],1,'Staatliche Käufe von Waren und Dienstleistungen sind der Geldstrom C_St.','CSt','Staatskonsum C_St ↓','Es geht um staatliche Käufe, nicht um staatliche Transferzahlungen.'],
 ['Was passiert zunächst bei den betroffenen Unternehmen?',['Umsätze und Auftragseingänge sinken.','Die Nachfrage der Haushalte steigt zwangsläufig.','Umsätze steigen.'],0,'Weniger staatliche Aufträge bedeuten zunächst weniger Einnahmen bei den belieferten Unternehmen.','U','Unternehmensumsatz ↓','Weniger Bestellungen verursachen weniger Aufträge.'],
 ['Wie reagieren Unternehmen, falls die Nachfrageschwäche anhält?',['Sie erhöhen immer die Beschäftigung.','Sie müssen mehr exportieren.','Sie verringern Produktion und Beschäftigung.'],2,'Die geringere Nachfrage kann zu einer Einschränkung von Produktion und Beschäftigung führen.','U','Produktion und Beschäftigung ↓','Wenn weniger verkauft wird, muss häufig auch weniger produziert werden.'],
 ['Welcher Geldstrom wird dadurch schwächer?',['Transferzahlungen an Unternehmen Z_U steigen zwangsläufig.','Faktoreinkommen Fe sinkt.','Exporte X steigen automatisch.'],1,'Geringere Beschäftigung und schwächere Gewinne senken typischerweise das Faktoreinkommen Fe.','Fe','Faktoreinkommen Fe ↓','Was passiert mit Löhnen und Gewinnen bei geringerer Produktion?'],
 ['Wie wirkt sich das auf Haushalte aus?',['Ihr verfügbares Einkommen sinkt.','Ihr verfügbares Einkommen steigt zwangsläufig.','Ihre Einkommen bleiben unabhängig von Löhnen und Gewinnen.'],0,'Bei sonst gleichen Bedingungen haben Haushalte weniger Geld zur Verfügung.','H','verfügbares Einkommen ↓','Denke an die Folgen sinkender Einkommen für die Kaufkraft.'],
 ['Welche weitere Nachfragewirkung kann entstehen?',['Exporte X steigen zwangsläufig.','Es gibt keinerlei Folgewirkung.','Haushalte reduzieren C_H; dadurch verlieren Unternehmen nochmals Umsatz.'],2,'Weniger privater Konsum schwächt die Nachfrage zusätzlich und verstärkt den Rückgang.','CH','Konsum C_H ↓','Weniger verfügbares Einkommen kann den privaten Konsum bremsen.'])},
{id:'transfers',name:'Mehr Transfers',type:'Fiskalpolitik',title:'Transferzahlungen werden erhöht',trigger:'Der Staat erhöht die Transferzahlungen an private Haushalte, etwa Sozialleistungen.',dir:1,outcome:'positiv',kind:'expansiv',chain:'Transfers Z_H ↑ → verfügbares Einkommen der Haushalte ↑ → Konsum C_H ↑ → Umsätze der Unternehmen ↑ → Produktion und Beschäftigung ↑ → Faktoreinkommen Fe ↑ → weiterer Konsum.',finish:'Die Transferzahlung erhöht zuerst das verfügbare Einkommen. Wenn Haushalte einen Teil davon ausgeben, entstehen weitere Umsätze und Einkommen, die neue Konsumrunden anstoßen.',steps:steps(
 ['Welcher Strom setzt den Impuls?',['Staatlicher Konsum C_St sinkt.','Exporte X steigen.','Transferzahlungen Z_H steigen.'],2,'Z_H steht für Zahlungen des Staates an Haushalte, denen kein unmittelbarer Kauf einer Leistung gegenübersteht.','ZH','Transfers Z_H ↑','Sozialleistungen fließen vom Staat direkt zu Haushalten.'],
 ['Was ändert sich unmittelbar bei den Haushalten?',['Ihr verfügbares Einkommen steigt.','Ihre Faktoreinkommen Fe müssen sinken.','Sie erhalten weniger Geld.'],0,'Transferzahlungen erhöhen bei sonst gleichen Bedingungen das verfügbare Haushaltseinkommen.','H','verfügbares Einkommen ↑','Der Transfer kommt direkt bei den Haushalten an.'],
 ['Wie können Haushalte auf das zusätzliche Einkommen reagieren?',['Sie müssen alles sparen.','Sie steigern einen Teil ihrer Konsumausgaben C_H.','Sie senken ihre Konsumausgaben zwangsläufig.'],1,'Ein Teil des zusätzlichen Einkommens kann für Konsum eingesetzt werden.','CH','Konsum C_H ↑','Konsum und Sparen sind mögliche Verwendungen zusätzlichen Einkommens.'],
 ['Welche Wirkung hat dieser Konsum auf die Unternehmen?',['Es verringert die Exporte automatisch.','Die Unternehmensumsätze sinken.','Die Unternehmensumsätze steigen.'],2,'Höhere Konsumausgaben sind zusätzliche Einnahmen der Unternehmen.','U','Unternehmensumsatz ↑','Der Konsumstrom C_H fließt von Haushalten zu Unternehmen.'],

 ['Wenn C_H zunimmt, welche zwei weiteren Geldströme profitieren?',['Nur staatliche Ersparnis S_St steigt zwingend.','Zusätzliche Käufe bringen Unternehmen mehr Umsatz und erhöhen T_ind.','Staatliche Kreditaufnahme Kr_St muss unmittelbar unter das Ausgangsniveau sinken.'],1,'Steuerpflichtiger zusätzlicher Konsum erzeugt einen weiteren Umsatzimpuls bei Unternehmen und in der Regel mehr T_ind.','CH','Unternehmensumsatz ↑ + T_ind ↑','Ein zusätzlicher Einkauf wirkt auf Verkäufer und Staat zugleich.','St',[['CH',1],['U',1],['Tind',1]]],
 ['Welche Aussage über den staatlichen Finanzierungsbedarf ist korrekt?',['T_ind macht die anfängliche Kreditaufnahme Kr_St automatisch rückgängig.','Höhere T_ind hat überhaupt keinen Einfluss auf den Haushalt.','Die höheren Steuereinnahmen können den zusätzlichen Kreditbedarf gegenüber einer Lage ohne Rückflüsse dämpfen, aber nicht zwingend aufheben.'],2,'Die Rückflüsse aus T_ind entlasten das Budget relativ zu einer Situation ohne solche Rückflüsse. Der anfangs höhere Strom Kr_St ist dadurch aber nicht automatisch verschwunden.','Tind','Steuerrückfluss T_ind ↑','Unterscheide den ursprünglichen Kreditimpuls von einer teilweisen späteren Gegenfinanzierung.','Rückkopplung'])}

];
const flows=[
{id:'X',label:'X',d:'M 88 430 V 30 H 265',tx:70,ty:250},
{id:'M',label:'M',d:'M 265 94 H 116 V 430',tx:138,ty:250,extra:1},
{id:'Fe',label:'Fe',d:'M 393 76 H 816',tx:602,ty:65},
{id:'CH',label:'C_H',d:'M 816 111 H 393',tx:604,ty:136},
{id:'Tind',label:'T_ind',d:'M 393 132 L 566 266',tx:459,ty:195,extra:1},
{id:'ZU',label:'Z_U',d:'M 554 285 L 407 132',tx:486,ty:241,extra:1},
{id:'CSt',label:'C_St',d:'M 554 307 H 482 V 129 H 393',tx:491,ty:294},
{id:'Tdir',label:'T_dir',d:'M 816 129 L 670 266',tx:746,ty:193},
{id:'ZH',label:'Z_H',d:'M 682 296 L 844 133',tx:741,ty:261},
{id:'D',label:'D',d:'M 348 133 V 467 H 554',tx:339,ty:378,extra:1},
{id:'Ibr',label:'I^br',d:'M 554 448 H 438 V 133 H 393',tx:441,ty:384},
{id:'SSt',label:'S_St',d:'M 602 344 V 430',tx:581,ty:398,extra:1},
{id:'KrSt',label:'Kr_St',d:'M 642 430 V 344',tx:675,ty:393,extra:1},
{id:'SH',label:'S_H',d:'M 883 133 V 467 H 682',tx:910,ty:325,extra:1},
{id:'Fo',label:'Fo_Ausl.',d:'M 554 474 H 153',tx:330,ty:463,extra:1},
{id:'Verb',label:'Verb_Ausl.',d:'M 153 501 H 554',tx:332,ty:527,extra:1}
];
const nodes=[{id:'U',name:'U',sub:'Unternehmen',x:265,y:55,w:128,h:78},{id:'H',name:'H',sub:'Haushalte',x:816,y:55,w:128,h:78},{id:'St',name:'St',sub:'Staat',x:554,y:266,w:128,h:78},{id:'VV',name:'VV',sub:'Vermögensänderung',x:554,y:430,w:128,h:78},{id:'Ausl',name:'Ausl.',sub:'Ausland',x:25,y:430,w:128,h:78}];
const root=document.getElementById('kreislauf-app');
const complete=new Set();
let active=0,index=0,choice=-1,checked=false,finished=false,finalChoice=-1,finalChecked=false,full=false;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// Einheitliche Darstellung der volkswirtschaftlichen Symbole in HTML und SVG.
// hochgestellt: T^dir, T^ind, I^br; tiefgestellt: Sektorindizes H, U, St, Ausl.
const symbolRe=/\b(T_(?:dir|ind)|I\^br|(?:Verb|Fo|Kr|C|Z|S)_(?:Ausl\.|St|H|U))(?=$|[^\w])/g;
function mathText(value,svgMode=false){
 const source=String(value);
 let output='',last=0;
 for(const match of source.matchAll(symbolRe)){
  output+=esc(source.slice(last,match.index));
  const token=match[0],sup=token.startsWith('T_')||token.includes('^'),parts=token.split(token.includes('^')?'^':'_');
  const base=esc(parts[0]),index=esc(parts[1]);
  output+=svgMode
   ? `${base}<tspan baseline-shift="${sup?'super':'sub'}" font-size="65%">${index}</tspan>`
   : `<span class="math-symbol">${base}<${sup?'sup':'sub'}>${index}</${sup?'sup':'sub'}></span>`;
  last=match.index+token.length;
 }
 return output+esc(source.slice(last));
}

const scenario=()=>scenarios[active];
function swap(i){active=i;index=0;choice=-1;checked=false;finished=false;finalChoice=-1;finalChecked=false;full=false;render();}
function unlocked(){const s=scenario();return s.steps.slice(0,index+(checked&&choice===s.steps[index]?.correct?1:0));}
function effectsOf(step,s){return step.effects?.length?step.effects:[{id:step.focus,dir:s.dir,optional:false}];}
function revealedEffects(s,seen){const map=new Map();for(const step of seen){for(const effect of effectsOf(step,s)){if(!effect.id)continue;map.set(effect.id,effect);}}return map;}
function toneOf(step,s){const dirs=new Set(effectsOf(step,s).map(x=>x.dir));return dirs.size>1?'mixed':dirs.has(1)?'up':'down';}
function svg(){
 const s=scenario(),seen=unlocked(),eMap=revealedEffects(s,seen),up='#0e996b',down='#dd684f';
 const included=flows; // Sämtliche Geldströme bleiben immer sichtbar; nur ihre Wirkung wird schrittweise markiert.
 const lines=included.map(f=>{const effect=eMap.get(f.id),hit=!!effect,color=hit?(effect.dir>0?up:down):'#a8bac8',marker=hit?(effect.dir>0?'up':'down'):'base',symbol=hit?(effect.dir>0?'↑':'↓'):'';return `<g><path class="flow-path" d="${f.d}" stroke="${color}" opacity="${hit?1:.76}" stroke-dasharray="${effect?.optional?'8 6':'none'}" marker-end="url(#arr-${marker})"/><text class="flow-label" x="${f.tx}" y="${f.ty}" fill="${hit?color:'#869cab'}">${mathText(f.label,true)}${hit?' '+symbol+(effect.optional?'*':''):''}</text></g>`}).join('');
 const boxes=nodes.map(n=>{const effect=eMap.get(n.id),hit=!!effect,color=hit?(effect.dir>0?up:down):'#fff',base=n.id==='Ausl'?'#c92c37':'#097bbb',symbol=hit?(effect.dir>0?'↑':'↓'):'';return `<g><rect class="node" x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" fill="${base}" stroke="${color}" stroke-width="${hit?5:2}"/><text class="node-label" x="${n.x+n.w/2}" y="${n.y+35}">${n.name}</text><text class="node-sub" x="${n.x+n.w/2}" y="${n.y+57}" style="font-size:${n.id==='VV'?10.7:13}px">${n.sub}</text>${hit?`<circle cx="${n.x+n.w-5}" cy="${n.y+5}" r="15" fill="${color}" stroke="white" stroke-width="2"/><text class="active-symbol" x="${n.x+n.w-5}" y="${n.y+10}" fill="white">${symbol}</text>`:''}</g>`}).join('');
 return `<svg class="diagram-svg" viewBox="0 0 970 540" role="img" aria-label="Geldkreislauf mit Haushalten, Unternehmen, Staat, Vermögensänderung und Ausland; grün markiert Zunahmen, rot markiert Abnahmen. Gestrichelte Linien zeigen mögliche alternative staatliche Finanzierungsfolgen."><defs><marker id="arr-base" markerWidth="8" markerHeight="8" refX="6.8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6.8,3 L0,6 Z" fill="#c5d3df"/></marker><marker id="arr-up" markerWidth="8" markerHeight="8" refX="6.8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6.8,3 L0,6 Z" fill="${up}"/></marker><marker id="arr-down" markerWidth="8" markerHeight="8" refX="6.8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6.8,3 L0,6 Z" fill="${down}"/></marker></defs><rect width="970" height="540" rx="16" fill="#fbfdff"/>${lines}${boxes}</svg>`;
}
function branchDiagram(s,done=unlocked()){
 const origin=done.filter(x=>x.branch==='Impuls').map(x=>x.chip).join(' · ');
 const lanes=[['H','Haushalte'],['U','Unternehmen'],['St','Staat']];
 const laneHtml=lanes.map(([id,name])=>{const entries=done.filter(x=>x.branch===id);return `<div class="branch-lane"><div class="branch-title">${name}</div><div class="branch-chips">${entries.map(x=>`<div class="branch-step ${toneOf(x,s)} ${x.effects?.some(e=>e.optional)?'optional':''}">${mathText(x.chip)}</div>`).join('')||'<p class="branch-empty">Dieser Zweig wird im Verlauf ergänzt.</p>'}</div></div>`}).join('');
 const feed=done.filter(x=>x.branch==='Rückkopplung').map(x=>x.chip).join(' · ');
 return `<div class="branch-root"><span class="branch-pill">${origin?mathText(origin):'Ausgangsimpuls →'}</span></div><div class="branch-fork"></div><div class="branch-grid">${laneHtml}</div><div class="branch-loop">${feed?mathText(feed):'Rückkopplung zum nächsten Nachfrage- und Einkommenskreislauf'}</div>`;
}
function solutionChain(s){if(!s.advanced)return `<p><strong>${mathText(s.chain)}</strong></p>`;return `<div class="branch-summary">${s.chain.split(' | ').map((piece,i)=>`<div class="branch-summary-row"><strong>${['Ausgangspunkt:','Verzweigung:','Staat/Finanzierung:','Rückkopplung:'][i]||'Weitere Folge:'}</strong> ${mathText(piece)}</div>`).join('')}</div>`;}

function chainView(){const s=scenario(),seen=unlocked();if(s.advanced)return `<p class="branch-caption">Ein Impuls kann mehrere Bereiche <strong>gleichzeitig</strong> verändern. Die Zweige ergänzen sich mit jeder beantworteten Frage.</p>${branchDiagram(s,seen)}`;if(!seen.length)return '<span class="chain-empty">Die Wirkungskette entsteht, sobald du die erste Frage beantwortet hast.</span>';return seen.map(x=>`<span class="chip ${toneOf(x,s)}">${mathText(x.chip)}</span>`).join('<span class="chain-arrow">›</span>');}
function answerButtons(options,selected,verified,correct){return `<div class="answers">${options.map((o,i)=>`<button type="button" class="answer ${selected===i?'selected':''} ${verified&&selected===i?(selected===correct?'right':'wrong'):''}" data-action="choose" data-idx="${i}" aria-pressed="${selected===i}" ${verified&&selected===correct?'disabled':''}><span class="answer-key">${'ABC'[i]}</span><span>${mathText(o)}</span></button>`).join('')}</div>`;}
function exercise(){const s=scenario(),isFinal=index>=s.steps.length;const q=isFinal?null:s.steps[index];const correct=!!q&&checked&&choice===q.correct,wrong=!!q&&checked&&choice!==q.correct;const outcomeCorrect=finalChecked&&((finalChoice===0&&s.dir===1)||(finalChoice===1&&s.dir===-1));
 const dots=s.steps.map((_,i)=>`<span class="dot ${i<index?'achieved':i===index?'current':''}"></span>`).join('')+`<span class="dot ${isFinal?'current':''}"></span>`;
 let inner='';
 if(!isFinal){inner=`<h3 class="question">${mathText(q.question)}</h3>${answerButtons(q.options,choice,checked,q.correct)}${correct?`<div class="feedback good" role="status"><strong>Richtig – Wirkung erkannt!</strong>${mathText(q.why)}</div>`:''}${wrong?`<div class="feedback bad" role="status"><strong>Noch nicht ganz.</strong>${mathText(q.hint)} Wähle eine andere Antwort und prüfe erneut.</div>`:''}<div class="actions"><button type="button" class="secondary" data-action="reset">Fall neu beginnen</button>${correct?`<button type="button" class="primary" data-action="next">${index===s.steps.length-1?'Multiplikatoreffekt bestimmen':'Nächsten Schritt erschließen'} →</button>`:`<button type="button" class="primary" data-action="check" ${choice<0?'disabled':''}>Antwort prüfen</button>`}</div>`;}
 else if(!outcomeCorrect){inner=`<h3 class="question">Welche Art von Multiplikatoreffekt ergibt sich aus der Wirkungskette?</h3><p class="subheading">Beurteile die Folgewirkung auf Nachfrage, Produktion und Einkommen – nicht nur den ersten Geldstrom.</p>${answerButtons(['Positiver Multiplikatoreffekt (expansiv)','Negativer Multiplikatoreffekt (kontraktiv)'],finalChoice,finalChecked,s.dir===1?0:1)}${finalChecked&&!outcomeCorrect?'<div class="feedback bad" role="status"><strong>Prüfe die Kettenreaktion noch einmal.</strong>Breiten sich steigende oder sinkende Ausgaben und Einkommen aus?</div>':''}<div class="actions"><button type="button" class="secondary" data-action="reset">Fall neu beginnen</button><button type="button" class="primary" data-action="final-check" ${finalChoice<0?'disabled':''}>Multiplikatoreffekt prüfen</button></div>`;}
 else{inner=`<h3 class="question">Du hast die gesamte Wirkungskette richtig zugeordnet.</h3><div class="conclusion ${s.dir<0?'down':''}"><h3>${s.dir===1?'↑ Positiver Multiplikatoreffekt – expansiv':'↓ Negativer Multiplikatoreffekt – kontraktiv'}</h3><p>${esc(s.finish)}</p></div><div class="solution"><h3>Vollständige Wirkungskette</h3>${solutionChain(s)}<p>Das ist ein qualitativer Nachfrage-Multiplikator: Zusätzliche Ausgaben erzeugen weitere Einkommen und damit potenziell neue Ausgaben – oder geringere Ausgaben lösen weitere Einkommensrückgänge aus.</p></div><div class="actions"><button type="button" class="secondary" data-action="reset">Fall wiederholen</button><button type="button" class="primary" data-action="next-case">Weiteren Fall bearbeiten →</button></div>`;}
 return `<section class="panel exercise ${s.advanced?'advanced':''}"><div class="exercise-head"><span class="kicker">${isFinal?'Abschluss · Multiplikatoreffekt':'Wirkungskette · Entscheide den nächsten Schritt'}</span><div class="progress" role="img" aria-label="Fortschritt im Fall">${dots}</div></div>${inner}<div class="actions" style="margin-top:14px;justify-content:flex-end"><button type="button" class="secondary" data-action="solution">${full?'Lösungsweg ausblenden':'Lösungsweg anzeigen'}</button></div>${full?`<div class="solution"><h3>Auflösung zum aktuellen Fall</h3>${solutionChain(s)}<p><strong>Ergebnis:</strong> ${s.dir===1?'positiver (expansiver)':'negativer (kontraktiver)'} Multiplikatoreffekt.</p><p>${esc(s.finish)}</p></div>`:''}${s.advanced?'<div class="footnote"><strong>Verzweigungen:</strong> Jede Farbe bezieht sich auf den einzelnen Geldstrom, nicht auf den Multiplikator als Ganzes. <strong>Gestrichelte Alternativen (*)</strong> bei S_St und Kr_St hängen von der Haushaltslage ab und müssen nicht gleichzeitig eintreten.</div>':''}<div class="footnote"><strong>Modellannahme:</strong> Die gezeigten Folgewirkungen gelten insbesondere dann, wenn Unternehmen ihre Produktion anpassen können und Haushalte auf Einkommensänderungen mit geändertem Konsum reagieren. Sparen, Steuern, Importe und Kapazitätsgrenzen können die Wirkung abschwächen.</div></section>`;
}
function render(){
 const s=scenario();
 const caseButton=(x,i)=>`<button class="case-button ${x.advanced?'advanced':''} ${i===active?'active':''}" data-action="case" data-idx="${i}" aria-current="${i===active?'true':'false'}"><div class="case-top"><span class="case-name">${esc(x.name)}</span>${complete.has(x.id)?'<span class="done-icon" aria-label="Bearbeitet">✓</span>':''}</div><span class="case-type">${esc(x.type)}</span></button>`;
 const intro=scenarios.filter(x=>!x.advanced).map(x=>caseButton(x,scenarios.indexOf(x))).join('');
 const expert=scenarios.filter(x=>x.advanced).map(x=>caseButton(x,scenarios.indexOf(x))).join('');
 root.innerHTML=`<header class="hero"><div><div class="eyebrow">VWL · Interaktive Übung</div><h1>Der Kreislauf in Bewegung</h1><p>Was passiert nach einem wirtschaftlichen Impuls? Verfolge Geldströme und Zwischenwirkungen bis zum Multiplikatoreffekt – jetzt auch mit parallelen Verzweigungen, ganz ohne Rechenaufgaben.</p></div><div class="hero-tag">Qualitatives Falltraining</div></header><div class="workspace"><aside class="sidebar"><h2>Wähle einen Fall</h2><p class="hint">Basisfälle und danach die farbig abgesetzte Vertiefungsreihe. Du entscheidest Schritt für Schritt.</p><div class="case-list">${intro}</div><div class="series-divider"><div class="series-head">✦ Vertiefung: Verzweigte Kreisläufe</div><p>Drei neue Fälle · Sparen, indirekte Steuern, staatliche Finanzierung</p></div><div class="case-list">${expert}</div><div class="sidebar-footer">✓ kennzeichnet abgeschlossene Fälle. Bei falschen Antworten kannst du es erneut versuchen. Grün/Rot zeigt die <em>Richtung jedes Geldstroms</em> – unabhängig vom gesamten Multiplikatoreffekt.</div></aside><main class="main"><section class="panel scenario ${s.advanced?'advanced':''}"><div class="topline"><span class="kicker">Ausgangssituation · ${esc(s.type)}</span>${s.advanced?'<span class="series-tag">✦ Verzweigte Wirkungen</span>':'<span class="direction">Impulse erkennen · Folgen ableiten</span>'}</div><h2>${esc(s.title)}</h2><p>${mathText(s.trigger)}</p></section><section class="panel diagram ${s.advanced?'advanced':''}"><div class="section-head"><h3>Kreislaufmodell · Geldströme</h3><span class="stream-status">Alle Geldströme dauerhaft sichtbar</span></div>${svg()}<div class="diagram-note"><span class="swatch" style="background:#0e996b"></span><span class="legend-strong">Grün ↑</span> bedeutet Zunahme <span class="swatch" style="background:#dd684f"></span><span class="legend-strong">Rot ↓</span> bedeutet Abnahme. Pfeile zeigen immer die tatsächliche Geldflussrichtung und drehen sich bei einer Abnahme nicht um.${s.advanced?' <strong>Gestrichelt (*)</strong> zeigt alternative staatliche Finanzierungsreaktionen.':''} Alle Geldströme bleiben sichtbar; im Verlauf werden die jeweils betroffenen Ströme hervorgehoben. Reale Folgen ohne eigenen Geldstrom erscheinen im Verzweigungsdiagramm.</div></section><section class="panel chain ${s.advanced?'advanced':''}"><div class="chain-label">${s.advanced?'Verzweigungsdiagramm · Deine bislang entdeckten Folgen':'Deine bisher entdeckte Wirkungskette'}</div><div class="${s.advanced?'':'chain-steps'}" aria-live="polite">${chainView()}</div></section>${exercise()}</main></div>`;
}

root.addEventListener('click',e=>{const button=e.target.closest('button[data-action]');if(!button||!root.contains(button))return;const act=button.dataset.action,n=Number(button.dataset.idx),s=scenario();
 if(act==='case'){swap(n);return}
 if(act==='reset'){swap(active);return}
 if(act==='solution'){full=!full;render();return}
 if(act==='choose') {if(index<s.steps.length){choice=n;checked=false}else{finalChoice=n;finalChecked=false}render();return}
 if(act==='check'&&index<s.steps.length&&choice>=0){checked=true;render();return}
 if(act==='next'&&index<s.steps.length&&checked&&choice===s.steps[index].correct){index++;choice=-1;checked=false;render();return}
 if(act==='final-check'&&index>=s.steps.length&&finalChoice>=0){finalChecked=true;if((finalChoice===0&&s.dir===1)||(finalChoice===1&&s.dir===-1)){complete.add(s.id);finished=true}render();return}
 if(act==='next-case'){swap((active+1)%scenarios.length);return}
});
render();
})();
</script>
