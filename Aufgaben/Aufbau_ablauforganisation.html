</style></head><body style="margin:0;background:#eef3f8"><div id="app"></div><script>window.H5P={};H5P.EventDispatcher=function(){};H5P.EventDispatcher.prototype.trigger=function(){};H5P.EventDispatcher.prototype.triggerXAPIScored=function(){};</script><script>var H5P = H5P || {};

H5P.BusinessProcessBavaria = (function (EventDispatcher) {
  'use strict';

  function BusinessProcessBavaria(params, contentId, extras) {
    EventDispatcher.call(this);
    this.params = Object.assign({
      title: 'Vom Kundenauftrag zum fertigen E‑Bike',
      subtitle: 'Aufbauorganisation trifft Ablauforganisation',
      companyName: 'AlpinaBike GmbH',
      passingPercentage: 60
    }, params || {});
    this.contentId = contentId;
    this.extras = extras || {};
    this.score = 0;
    this.maxScore = 29;
    this.answerGiven = false;
    this.finished = false;
    this.root = null;
    this.selectedProcessCard = null;
  }

  BusinessProcessBavaria.prototype = Object.create(EventDispatcher.prototype);
  BusinessProcessBavaria.prototype.constructor = BusinessProcessBavaria;

  BusinessProcessBavaria.prototype.getTitle = function () {
    return this.params.title;
  };

  BusinessProcessBavaria.prototype.getScore = function () {
    return this.score;
  };

  BusinessProcessBavaria.prototype.getMaxScore = function () {
    return this.maxScore;
  };

  BusinessProcessBavaria.prototype.getAnswerGiven = function () {
    return this.answerGiven;
  };

  BusinessProcessBavaria.prototype.getCurrentState = function () {
    return {
      score: this.score,
      maxScore: this.maxScore,
      finished: this.finished
    };
  };

  BusinessProcessBavaria.prototype.attach = function ($container) {
    var self = this;
    $container.addClass('h5p-business-process-bavaria');
    $container.html('');
    this.root = document.createElement('div');
    this.root.className = 'bpb-app';
    this.root.innerHTML = this.renderApp();
    $container.get(0).appendChild(this.root);
    this.bindNavigation();
    this.bindDiscovery();
    this.bindProcessAssignment();
    this.bindBuildFlowQuiz();
    this.bindIncidentQuiz();
    this.bindFinalQuiz();
    this.updateProgress(1);
    window.setTimeout(function () { self.trigger('resize'); }, 50);
  };

  BusinessProcessBavaria.prototype.renderApp = function () {
    var p = this.params;
    return `
      <header class="bpb-hero">
        <div class="bpb-hero__eyebrow">Wirtschaft & Recht · Oberstufe · erhöhtes Anforderungsniveau</div>
        <h1>${this.escapeHtml(p.title)}</h1>
        <p class="bpb-hero__subtitle">${this.escapeHtml(p.subtitle)}</p>
        <div class="bpb-factory" aria-hidden="true">
          <div class="bpb-factory__sky"></div>
          <div class="bpb-factory__building"><span>ALPINABIKE</span></div>
          <div class="bpb-factory__chimney"></div>
          <div class="bpb-factory__truck">🚚</div>
          <div class="bpb-factory__bike">🚲</div>
        </div>
        <div class="bpb-progress-wrap" aria-label="Lernfortschritt">
          <div class="bpb-progress"><div class="bpb-progress__bar" style="width:14%"></div></div>
          <span class="bpb-progress__text">1 / 7</span>
        </div>
      </header>

      <main>
        ${this.renderIntro()}
        ${this.renderDiscovery()}
        ${this.renderAssignment()}
        ${this.renderSolution()}
        ${this.renderStructureFlowQuiz()}
        ${this.renderIncident()}
        ${this.renderFinal()}
      </main>
    `;
  };

  BusinessProcessBavaria.prototype.renderIntro = function () {
    return `
      <section class="bpb-step is-active" data-step="1">
        <div class="bpb-section-head">
          <span class="bpb-kicker">01 · Einstieg</span>
          <h2>Ein Auftrag geht auf Reisen</h2>
        </div>
        <div class="bpb-scenario-grid">
          <article class="bpb-card bpb-card--accent">
            <div class="bpb-card__icon">📩</div>
            <h3>Der Kundenauftrag</h3>
            <p>Ein großer Fahrradfachhändler bestellt bei der <strong>${this.escapeHtml(this.params.companyName)}</strong> 100 E‑Bikes des Modells „AlpenCross X“.</p>
          </article>
          <article class="bpb-card">
            <div class="bpb-card__icon">⏱️</div>
            <h3>Die Herausforderung</h3>
            <p>Lieferzeit: sechs Wochen. Zusätzliche Akkus und Schaltungen werden benötigt. Die vorhandene Fertigungskapazität reicht nicht vollständig aus.</p>
          </article>
          <article class="bpb-card">
            <div class="bpb-card__icon">🎯</div>
            <h3>Dein Auftrag</h3>
            <p>Verfolge den Geschäftsprozess und finde heraus, <strong>welcher Funktionsbereich welchen Prozessschritt übernimmt</strong> – einschließlich der Verwaltung.</p>
          </article>
        </div>
        <div class="bpb-concept-strip">
          <div><strong>Aufbauorganisation</strong><span>Wer macht was?</span></div>
          <div class="bpb-arrow">↔</div>
          <div><strong>Ablauforganisation</strong><span>Was geschieht wann?</span></div>
        </div>
        ${this.navButtons(false, true)}
      </section>
    `;
  };

  BusinessProcessBavaria.prototype.renderDiscovery = function () {
    var steps = [
      ['1','Kundenauftrag','Auftrag des Fachhändlers erfassen'],
      ['2','Kapazität prüfen','Personal, Maschinen und Zeit prüfen'],
      ['3','Auftrag freigeben','Entscheidung über Annahme treffen'],
      ['4','Finanzierung prüfen','Zusätzliche Montagestation beurteilen'],
      ['5','Material beschaffen','Akkus, Schaltungen und Bauteile bestellen'],
      ['6','Produktion planen','Fertigungsreihenfolge und Einsatz planen'],
      ['7','E‑Bikes fertigen','Montage und Qualitätskontrolle'],
      ['8','Ausliefern','Ware an den Kunden übergeben'],
      ['9','Rechnung erstellen','Rechnung erstellen und an den Kunden versenden'],
      ['10','Zahlungseingang','Zahlungseingang überwachen und verbuchen'],
      ['11','Kontrollieren','Zeit-, Kosten- und Qualitätsziele prüfen']
    ];
    var cards = steps.map(function (s) {
      return `<button class="bpb-process-peek" type="button" aria-expanded="false"><span>${s[0]}</span><strong>${s[1]}</strong><small>${s[2]}</small></button>`;
    }).join('');
    return `
      <section class="bpb-step" data-step="2">
        <div class="bpb-section-head"><span class="bpb-kicker">02 · Prozess entdecken</span><h2>Vom Auftrag bis zur Kontrolle</h2><p>Klicke die Stationen an. Ein Geschäftsprozess ist eine sachlogische und zeitliche Folge miteinander verbundener Tätigkeiten.</p></div>
        <div class="bpb-process-line" aria-label="Elf Prozessschritte">${cards}</div>
        <div class="bpb-tip">💡 <strong>Beobachte:</strong> Schon dieser Ablauf deutet an, dass ein Kundenauftrag nicht nur „einer Abteilung“ gehört.</div>
        ${this.navButtons(true, true)}
      </section>
    `;
  };

  BusinessProcessBavaria.prototype.renderAssignment = function () {
    var cards = [
      [1,'Kundenauftrag entgegennehmen','absatz'],
      [2,'Fertigungskapazität prüfen','produktion'],
      [3,'Großauftrag freigeben','fuehrung'],
      [4,'Finanzierung der Montagestation prüfen','finanzierung'],
      [5,'Akkus und Schaltungen bestellen','beschaffung'],
      [6,'Fertigungsreihenfolge planen','produktion'],
      [7,'E‑Bikes montieren und prüfen','produktion'],
      [8,'E‑Bikes ausliefern','absatz'],
      [9,'Rechnung erstellen und versenden','verwaltung'],
      [10,'Zahlungseingang überwachen','verwaltung'],
      [11,'Zielerreichung kontrollieren','fuehrung']
    ].map(function (c) {
      return `<button type="button" draggable="true" class="bpb-drag-card" data-id="${c[0]}" data-answer="${c[2]}" aria-pressed="false"><span class="bpb-drag-card__num">${c[0]}</span>${c[1]}</button>`;
    }).join('');
    var lanes = [
      ['beschaffung','🛒','Beschaffung'],
      ['produktion','⚙️','Produktion'],
      ['absatz','📈','Absatz'],
      ['verwaltung','🗂️','Verwaltung'],
      ['finanzierung','💶','Investition & Finanzierung'],
      ['fuehrung','🧭','Unternehmensführung']
    ].map(function (l) {
      return `<div class="bpb-dropzone" data-zone="${l[0]}" tabindex="0" role="button" aria-label="${l[2]} – ausgewählte Karte hier zuordnen"><div class="bpb-dropzone__head"><span>${l[1]}</span><strong>${l[2]}</strong></div><div class="bpb-dropzone__items"></div></div>`;
    }).join('');
    return `
      <section class="bpb-step" data-step="3">
        <div class="bpb-section-head"><span class="bpb-kicker">03 · Hauptaufgabe</span><h2>Welcher Funktionsbereich ist zuständig?</h2><p>Ziehe die Prozessschritte in den passenden Funktionsbereich. Alternativ: Karte anklicken und anschließend den Zielbereich anklicken.</p></div>
        <div class="bpb-assignment-layout">
          <div class="bpb-card-bank"><h3>Prozessschritte</h3><div class="bpb-card-bank__items">${cards}</div></div>
          <div class="bpb-lanes">${lanes}</div>
        </div>
        <div class="bpb-actions"><button type="button" class="bpb-btn bpb-btn--primary" data-action="check-assignment">Zuordnung prüfen</button><button type="button" class="bpb-btn bpb-btn--ghost" data-action="reset-assignment">Neu ordnen</button></div>
        <div class="bpb-feedback" data-feedback="assignment" aria-live="polite"></div>
        ${this.navButtons(true, true)}
      </section>
    `;
  };

  BusinessProcessBavaria.prototype.renderSolution = function () {
    var flow = [
      ['01','Auftrag','Absatz','absatz'],['02','Kapazität','Produktion','produktion'],['03','Freigabe','Unternehmensführung','fuehrung'],['04','Finanzierung','Investition & Finanzierung','finanzierung'],['05','Material','Beschaffung','beschaffung'],['06','Planung','Produktion','produktion'],['07','Fertigung','Produktion','produktion'],['08','Lieferung','Absatz','absatz'],['09','Rechnung','Verwaltung','verwaltung'],['10','Zahlung','Verwaltung','verwaltung'],['11','Kontrolle','Unternehmensführung','fuehrung']
    ];
    var nodes = flow.map(function (f, i) {

  };

  BusinessProcessBavaria.prototype.navButtons = function (back, next) {
    return `<div class="bpb-nav">${back ? '<button type="button" class="bpb-btn bpb-btn--ghost" data-nav="prev">← Zurück</button>' : '<span></span>'}${next ? '<button type="button" class="bpb-btn bpb-btn--next" data-nav="next">Weiter →</button>' : ''}</div>`;
  };

  BusinessProcessBavaria.prototype.bindNavigation = function () {
    var self = this;
    this.root.querySelectorAll('[data-nav]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var current = parseInt(self.root.querySelector('.bpb-step.is-active').dataset.step, 10);
        self.showStep(btn.dataset.nav === 'next' ? current + 1 : current - 1);
      });
    });
  };

  BusinessProcessBavaria.prototype.showStep = function (n) {
    var self = this;
    n = Math.max(1, Math.min(7, n));
    this.root.querySelectorAll('.bpb-step').forEach(function (s) { s.classList.toggle('is-active', parseInt(s.dataset.step, 10) === n); });
    this.updateProgress(n);
    this.root.scrollIntoView({behavior: 'smooth', block: 'start'});
    window.setTimeout(function () { self.trigger('resize'); }, 80);
  };

  BusinessProcessBavaria.prototype.updateProgress = function (n) {
    var pct = Math.round((n / 7) * 100);
    this.root.querySelector('.bpb-progress__bar').style.width = pct + '%';
    this.root.querySelector('.bpb-progress__text').textContent = n + ' / 7';
  };

  BusinessProcessBavaria.prototype.bindDiscovery = function () {
    this.root.querySelectorAll('.bpb-process-peek').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var open = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', open ? 'false' : 'true');
        btn.classList.toggle('is-open', !open);
      });
    });
  };

  BusinessProcessBavaria.prototype.bindProcessAssignment = function () {
    var self = this;
    var bank = this.root.querySelector('.bpb-card-bank__items');
    var cards = this.root.querySelectorAll('.bpb-drag-card');
    var zones = this.root.querySelectorAll('.bpb-dropzone');

    function selectCard(card) {
      cards.forEach(function (c) { c.classList.remove('is-selected'); c.setAttribute('aria-pressed', 'false'); });
      self.selectedProcessCard = card;
      card.classList.add('is-selected');
      card.setAttribute('aria-pressed', 'true');
    }

    cards.forEach(function (card) {
      card.addEventListener('click', function () { selectCard(card); });
      card.addEventListener('dragstart', function (e) { e.dataTransfer.setData('text/plain', card.dataset.id); selectCard(card); });
    });

    zones.forEach(function (zone) {
      zone.addEventListener('dragover', function (e) { e.preventDefault(); zone.classList.add('is-over'); });
      zone.addEventListener('dragleave', function () { zone.classList.remove('is-over'); });
      zone.addEventListener('drop', function (e) {
        e.preventDefault(); zone.classList.remove('is-over');
        var id = e.dataTransfer.getData('text/plain');
        var card = self.root.querySelector('.bpb-drag-card[data-id="' + id + '"]');
        if (card) zone.querySelector('.bpb-dropzone__items').appendChild(card);
      });
      function placeSelected() {
        if (self.selectedProcessCard) {
          zone.querySelector('.bpb-dropzone__items').appendChild(self.selectedProcessCard);
          self.selectedProcessCard.classList.remove('is-selected');
          self.selectedProcessCard.setAttribute('aria-pressed', 'false');
          self.selectedProcessCard = null;
        }
      }
      zone.addEventListener('click', placeSelected);
      zone.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); placeSelected(); } });
    });

    this.root.querySelector('[data-action="check-assignment"]').addEventListener('click', function () {
      var score = 0;
      cards.forEach(function (card) {
        var zone = card.closest('.bpb-dropzone');
        var correct = zone && zone.dataset.zone === card.dataset.answer;
        card.classList.toggle('is-correct', !!correct);
        card.classList.toggle('is-wrong', !correct);
        if (correct) score += 1;
      });
      self.root.dataset.assignmentScore = String(score);
      self.answerGiven = true;
      var fb = self.root.querySelector('[data-feedback="assignment"]');
      fb.className = 'bpb-feedback is-visible ' + (score === 11 ? 'is-good' : 'is-hint');
      fb.innerHTML = score === 11 ? '<strong>11/11 – vollständig richtig.</strong> Du hast die Prozessschritte den zuständigen Funktionsbereichen korrekt zugeordnet.' : '<strong>' + score + '/11 richtig.</strong> Prüfe die rot markierten Karten. Frage dich: Welche Abteilung verfügt über die notwendigen Aufgaben, Kompetenzen und Ressourcen?';
      self.trigger('resize');
    });

    this.root.querySelector('[data-action="reset-assignment"]').addEventListener('click', function () {
      cards.forEach(function (card) { card.classList.remove('is-correct','is-wrong','is-selected'); bank.appendChild(card); });
      self.root.dataset.assignmentScore = '0';
      self.root.querySelector('[data-feedback="assignment"]').className = 'bpb-feedback';
      self.selectedProcessCard = null;
      self.trigger('resize');
    });
  };

  BusinessProcessBavaria.prototype.bindBuildFlowQuiz = function () {
    var self = this;
    this.root.querySelector('[data-action="check-classify"]').addEventListener('click', function () {
      var rows = self.root.querySelectorAll('.bpb-classify-row');
      var score = 0;
      rows.forEach(function (row) {
        var ok = row.querySelector('select').value === row.dataset.answer;
        row.classList.toggle('is-correct', ok);
        row.classList.toggle('is-wrong', !ok);
        if (ok) score += 1;
      });
      self.root.dataset.classifyScore = String(score);
      self.answerGiven = true;
      var fb = self.root.querySelector('[data-feedback="classify"]');
      fb.className = 'bpb-feedback is-visible ' + (score === 8 ? 'is-good' : 'is-hint');
      fb.innerHTML = '<strong>' + score + '/8 richtig.</strong> Aufbau = Struktur und Zuständigkeit; Ablauf = Reihenfolge und Verknüpfung von Tätigkeiten.';
      self.trigger('resize');
    });
  };

  BusinessProcessBavaria.prototype.bindIncidentQuiz = function () {
    var self = this;
    this.root.querySelector('[data-action="check-incident"]').addEventListener('click', function () {
      var boxes = self.root.querySelectorAll('.bpb-incident input[type="checkbox"]');
      var score = 0;
      boxes.forEach(function (box) {
        var should = box.dataset.correct === 'true';
        var ok = box.checked === should;
        box.closest('label').classList.toggle('is-correct', ok);
        box.closest('label').classList.toggle('is-wrong', !ok);
        if (ok) score += 1;
      });
      self.root.dataset.incidentScore = String(score);
      self.answerGiven = true;
      var fb = self.root.querySelector('[data-feedback="incident"]');
      fb.className = 'bpb-feedback is-visible ' + (score === 6 ? 'is-good' : 'is-hint');
      fb.innerHTML = '<strong>' + score + '/6 Aussagen korrekt bewertet.</strong> Ein Lieferproblem kann sich entlang des gesamten Geschäftsprozesses auswirken – genau darin zeigt sich die Vernetzung der Funktionsbereiche.';
      self.trigger('resize');
    });
  };

  BusinessProcessBavaria.prototype.bindFinalQuiz = function () {
    var self = this;
    this.root.querySelector('[data-action="finish"]').addEventListener('click', function () {
      var scoreFinal = 0;
      self.root.querySelectorAll('.bpb-cloze select').forEach(function (sel) {
        var ok = sel.value === sel.dataset.answer;
        sel.classList.toggle('is-correct', ok);
        sel.classList.toggle('is-wrong', !ok);
        if (ok) scoreFinal += 1;
      });
      var assignment = parseInt(self.root.dataset.assignmentScore || '0', 10);
      var classify = parseInt(self.root.dataset.classifyScore || '0', 10);
      var incident = parseInt(self.root.dataset.incidentScore || '0', 10);
      self.score = assignment + classify + incident + scoreFinal;
      self.answerGiven = true;
      self.finished = true;
      var percent = Math.round((self.score / self.maxScore) * 100);
      var passed = percent >= Number(self.params.passingPercentage || 60);
      var fb = self.root.querySelector('[data-feedback="final"]');
      fb.className = 'bpb-feedback is-visible ' + (scoreFinal === 4 ? 'is-good' : 'is-hint');
      fb.innerHTML = '<strong>' + scoreFinal + '/4 Begriffe richtig.</strong>';
      var result = self.root.querySelector('.bpb-result');
      result.hidden = false;
      result.querySelector('[data-result-percent]').textContent = percent + '%';
      result.querySelector('[data-result-title]').textContent = self.score + ' von ' + self.maxScore + ' Punkten';
      result.querySelector('[data-result-text]').textContent = passed ? 'Lernziel erreicht: Du kannst Aufbau- und Ablauforganisation anhand eines Geschäftsprozesses miteinander verknüpfen.' : 'Bearbeite insbesondere die markierten Aufgaben erneut und nutze die grafische Auflösung als Orientierung.';
      result.classList.toggle('is-passed', passed);
      result.classList.toggle('is-retry', !passed);
      try {
        self.triggerXAPIScored(self.score, self.maxScore, 'completed', true, passed);
      } catch (e) {
        // Ergebnis bleibt auch ohne xAPI-Unterstützung vollständig nutzbar.
      }
      self.trigger('resize');
    });

    this.root.querySelector('[data-action="restart"]').addEventListener('click', function () {
      self.score = 0; self.answerGiven = false; self.finished = false;
      self.root.querySelectorAll('select').forEach(function (s) { s.value = ''; s.classList.remove('is-correct','is-wrong'); });
      self.root.querySelectorAll('.bpb-classify-row').forEach(function (r) { r.classList.remove('is-correct','is-wrong'); });
      self.root.querySelectorAll('input[type="checkbox"]').forEach(function (i) { i.checked = false; i.closest('label').classList.remove('is-correct','is-wrong'); });
      self.root.querySelectorAll('.bpb-feedback').forEach(function (f) { f.className = 'bpb-feedback'; f.innerHTML = ''; });
      self.root.querySelector('.bpb-result').hidden = true;
      var resetAssignment = self.root.querySelector('[data-action="reset-assignment"]');
      if (resetAssignment) resetAssignment.click();
      self.root.dataset.classifyScore = '0';
      self.root.dataset.incidentScore = '0';
      self.showStep(1);
    });
  };

  BusinessProcessBavaria.prototype.escapeHtml = function (text) {
    return String(text || '').replace(/[&<>'"]/g, function (c) {
      return {'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c];
    });
  };

  return BusinessProcessBavaria;
})(H5P.EventDispatcher);
